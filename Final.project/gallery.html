<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/gallery.css">
	<script src = "js/gallery.js"></script>
</head>
<body onload = "myFunction()">
	
	<div id = "image">
		Hover over an image below to display here.
	</div>
    <img class = "preview" src="images/Alpenblumen.jpg" alt="Beautiful pink flowers on a mountain meadow" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
    <img class = "preview" src="images/Stausee.jpeg" alt="View from a mountain on a turquoise water barrier" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
	<img class = "preview" src="images/Bergbach-mit-Schnee.JPG" alt="Mountain stream in a rocky and snowy valley" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
    <img class = "preview" src="images/Wasserfall.JPG" alt="Waterfall descending from a high alpine mountain" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
    <img class = "preview" src="images/Bergbach-und-Berg.jpg" alt="Mountain stream in between two mountains of green" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
    <img class = "preview" src="images/Blumen-und-Tanne.JPG" alt="A fir tree in front of high alpine mountains" width="100" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus = "upDate(this)" onblur = "unDo()">
</body>
</html>
